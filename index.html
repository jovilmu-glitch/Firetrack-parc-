<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FireTrack Parc - Inventari Mòbil</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome per a icones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            -webkit-tap-highlight-color: transparent;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased min-h-screen flex flex-col justify-between selection:bg-red-600 selection:text-white">

    <!-- CAPÇALERA -->
    <header class="bg-slate-950 border-b border-slate-800 sticky top-0 z-40 px-4 py-3 flex items-center justify-between shadow-md">
        <div class="flex items-center space-x-3">
            <div class="bg-red-600 text-white p-2 rounded-xl shadow-lg shadow-red-600/30 flex items-center justify-center">
                <i class="fa-solid fa-truck-fire text-lg"></i>
            </div>
            <div>
                <h1 class="font-bold text-base tracking-wide text-white leading-tight">FireTrack <span class="text-red-500">Parc</span></h1>
                <p class="text-xs text-slate-400">Parc de Bombers · Inventari Mòbil</p>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <button onclick="obrirModalGestio()" class="bg-slate-800 hover:bg-slate-700 active:bg-slate-600 text-slate-300 p-2.5 rounded-xl text-xs font-medium transition flex items-center space-x-1.5 border border-slate-700">
                <i class="fa-solid fa-gear text-slate-400"></i>
                <span class="hidden sm:inline">Gestió</span>
            </button>
            <button onclick="nouMaterialModal()" class="bg-red-600 hover:bg-red-500 active:bg-red-700 text-white px-3 py-2.5 rounded-xl text-xs font-semibold shadow-lg shadow-red-600/20 transition flex items-center space-x-1.5">
                <i class="fa-solid fa-plus"></i>
                <span>Nou</span>
            </button>
        </div>
    </header>

    <!-- CONTINGUT PRINCIPAL -->
    <main id="main-content" class="flex-1 max-w-lg w-full mx-auto px-4 py-4 pb-24">
        <!-- Es carregarà dinàmicament segons la pestanya activa -->
    </main>

    <!-- BARRA DE NAVEGACIÓ INFERIOR -->
    <nav class="bg-slate-950 border-t border-slate-800 fixed bottom-0 left-0 right-0 z-40 max-w-lg mx-auto grid grid-cols-4 py-2 px-3 shadow-2xl">
        <button onclick="canviarPestanya('flota')" id="nav-flota" class="nav-btn flex flex-col items-center justify-center py-1.5 text-red-500 transition">
            <i class="fa-solid fa-truck text-lg mb-0.5"></i>
            <span class="text-[10px] font-medium tracking-wide">Flota</span>
        </button>
        <button onclick="canviarPestanya('magatzem')" id="nav-magatzem" class="nav-btn flex flex-col items-center justify-center py-1.5 text-slate-400 hover:text-slate-200 transition">
            <i class="fa-solid fa-warehouse text-lg mb-0.5"></i>
            <span class="text-[10px] font-medium tracking-wide">Magatzem / Taller</span>
        </button>
        <button onclick="canviarPestanya('rastreig')" id="nav-rastreig" class="nav-btn flex flex-col items-center justify-center py-1.5 text-slate-400 hover:text-slate-200 transition">
            <i class="fa-solid fa-barcode text-lg mb-0.5"></i>
            <span class="text-[10px] font-medium tracking-wide">Rastreig / Cód.</span>
        </button>
        <button onclick="canviarPestanya('historial')" id="nav-historial" class="nav-btn flex flex-col items-center justify-center py-1.5 text-slate-400 hover:text-slate-200 transition">
            <i class="fa-solid fa-clock-rotate-left text-lg mb-0.5"></i>
            <span class="text-[10px] font-medium tracking-wide">Historial</span>
        </button>
    </nav>

    <!-- MODAL DE MOVIMENT / REASSIGNACIÓ -->
    <div id="modal-moure" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-t-3xl sm:rounded-2xl p-5 shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between pb-3 border-b border-slate-800 mb-4">
                <div class="flex items-center space-x-2">
                    <div class="bg-red-500/10 text-red-500 p-2 rounded-lg">
                        <i class="fa-solid fa-right-left"></i>
                    </div>
                    <h3 class="font-bold text-white text-sm" id="modal-moure-titol">Moure Material</h3>
                </div>
                <button onclick="tancarModalMoure()" class="text-slate-400 hover:text-white p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <form id="form-moure" onsubmit="guardarMoviment(event)" class="space-y-4">
                <input type="hidden" id="moure-material-id">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Material Seleccionat</label>
                    <p id="moure-material-nom" class="text-sm font-bold text-white bg-slate-950 px-3 py-2 rounded-xl border border-slate-800"></p>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Nova Ubicació Destí</label>
                    <select id="moure-desti-tipus" onchange="actualitzarDestiTipus()" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-red-500">
                        <option value="vehicle">Vehicle (Camió)</option>
                        <option value="magatzem">Magatzem Central</option>
                        <option value="taller">Taller / Reparació</option>
                        <option value="baixa">Baixa / Fora de servei</option>
                    </select>
                </div>
                <div id="bloc-seleccio-vehicle" class="space-y-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Seleccionar Camió</label>
                        <select id="moure-vehicle-id" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-red-500">
                            <!-- Opcions injectades per JS -->
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Compartiment / Zona Destí</label>
                        <select id="moure-compartiment" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-red-500">
                            <option value="Cabina">Cabina</option>
                            <option value="Armari 1">Armari 1</option>
                            <option value="Armari 2">Armari 2</option>
                            <option value="Armari 3">Armari 3</option>
                            <option value="Armari 4">Armari 4</option>
                            <option value="Armari 5">Armari 5</option>
                            <option value="Armari 6">Armari 6</option>
                            <option value="Bomba">Bomba</option>
                            <option value="Sostre">Sostre</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Observacions del moviment (opcional)</label>
                    <input type="text" id="moure-notes" placeholder="Ex: Canvi temporal per revisió" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-red-500">
                </div>
                <div class="pt-2 flex space-x-3">
                    <button type="button" onclick="tancarModalMoure()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium py-2.5 rounded-xl text-sm transition">Cancel·lar</button>
                    <button type="submit" class="flex-1 bg-red-600 hover:bg-red-500 text-white font-semibold py-2.5 rounded-xl text-sm transition shadow-lg shadow-red-600/30">Confirmar Moviment</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL D'EDICIÓ / CREACIÓ DE MATERIAL -->
    <div id="modal-material" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-t-3xl sm:rounded-2xl p-5 shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between pb-3 border-b border-slate-800 mb-4">
                <div class="flex items-center space-x-2">
                    <div class="bg-red-500/10 text-red-500 p-2 rounded-lg">
                        <i class="fa-solid fa-box-archive"></i>
                    </div>
                    <h3 class="font-bold text-white text-sm" id="modal-mat-titol">Nou Material</h3>
                </div>
                <button onclick="tancarModalMaterial()" class="text-slate-400 hover:text-white p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <form id="form-material" onsubmit="guardarMaterial(event)" class="space-y-3">
                <input type="hidden" id="edit-mat-id">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Nom de l'Eina / Material *</label>
                    <input type="text" id="edit-mat-nom" required placeholder="Ex: Càmera tèrmica FLIR K55" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-red-500">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Codi Barres Bombers (BG-)*</label>
                        <input type="text" id="edit-mat-codi" required placeholder="BG-482910" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-red-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Nº de Sèrie</label>
                        <input type="text" id="edit-mat-serie" placeholder="Opcional" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-red-500">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Categoria</label>
                        <select id="edit-mat-categoria" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-red-500">
                            <option value="Sanitari / DEA">Sanitari / DEA</option>
                            <option value="Rescat / Hidràulica">Rescat / Hidràulica</option>
                            <option value="Eines / Tall">Eines / Tall</option>
                            <option value="Mànigues / Aigua">Mànigues / Aigua</option>
                            <option value="Protecció / EPI">Protecció / EPI</option>
                            <option value="Il·luminació / Energia">Il·luminació / Energia</option>
                            <option value="Altres">Altres</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Estat Operatiu</label>
                        <select id="edit-mat-estat" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-red-500">
                            <option value="Operatiu">Operatiu</option>
                            <option value="Revisió pendent">Revisió pendent</option>
                            <option value="Averiat / Baixa">Averiat / Baixa</option>
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Vehicles Titular (Propietat)</label>
                        <select id="edit-mat-titular" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-red-500">
                            <!-- Omplert per JS -->
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Compartiment Titular</label>
                        <select id="edit-mat-comp-titular" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-red-500">
                            <option value="Cabina">Cabina</option>
                            <option value="Armari 1">Armari 1</option>
                            <option value="Armari 2">Armari 2</option>
                            <option value="Armari 3">Armari 3</option>
                            <option value="Armari 4">Armari 4</option>
                            <option value="Armari 5">Armari 5</option>
                            <option value="Armari 6">Armari 6</option>
                            <option value="Bomba">Bomba</option>
                            <option value="Sostre">Sostre</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Observacions / Detalls</label>
                    <textarea id="edit-mat-obs" rows="2" placeholder="Notas sobre el material..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-red-500"></textarea>
                </div>
                <div class="pt-2 flex space-x-3">
                    <button type="button" onclick="tancarModalMaterial()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium py-2.5 rounded-xl text-sm transition">Cancel·lar</button>
                    <button type="submit" class="flex-1 bg-red-600 hover:bg-red-500 text-white font-semibold py-2.5 rounded-xl text-sm transition shadow-lg shadow-red-600/30">Desar Material</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL DE GESTIÓ DE PARC / BACKUP / VEHICLES -->
    <div id="modal-gestio" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-t-3xl sm:rounded-2xl p-5 shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between pb-3 border-b border-slate-800 mb-4">
                <div class="flex items-center space-x-2">
                    <div class="bg-slate-800 text-slate-300 p-2 rounded-lg">
                        <i class="fa-solid fa-gear"></i>
                    </div>
                    <h3 class="font-bold text-white text-sm">Gestió i Configuració del Parc</h3>
                </div>
                <button onclick="tancarModalGestio()" class="text-slate-400 hover:text-white p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <div class="space-y-4">
                <div>
                    <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Flota de Vehicles del Parc</h4>
                    <div id="llista-vehicles-gestio" class="space-y-2 mb-3">
                        <!-- Injectat per JS -->
                    </div>
                    <button onclick="afegirVehiclePrompt()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 py-2 rounded-xl text-xs font-semibold border border-slate-700 transition flex items-center justify-center space-x-1.5">
                        <i class="fa-solid fa-plus text-red-500"></i>
                        <span>Afegir Nou Vehicle a la Flota</span>
                    </button>
                </div>

                <hr class="border-slate-800">

                <div>
                    <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Còpia de Seguretat (JSON)</h4>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="exportarJSON()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 py-2 px-3 rounded-xl text-xs font-semibold border border-slate-700 transition flex items-center justify-center space-x-1.5">
                            <i class="fa-solid fa-download text-emerald-500"></i>
                            <span>Exportar Dades</span>
                        </button>
                        <label class="bg-slate-800 hover:bg-slate-700 text-slate-200 py-2 px-3 rounded-xl text-xs font-semibold border border-slate-700 transition flex items-center justify-center space-x-1.5 cursor-pointer">
                            <i class="fa-solid fa-upload text-sky-500"></i>
                            <span>Importar JSON</span>
                            <input type="file" id="import-file" accept=".json" onchange="importarJSON(event)" class="hidden">
                        </label>
                    </div>
                </div>

                <hr class="border-slate-800">

                <div>
                    <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Zona de Perill</h4>
                    <button onclick="reiniciarDadesFabrica()" class="w-full bg-red-950/40 hover:bg-red-900/50 text-red-400 py-2 rounded-xl text-xs font-semibold border border-red-900/50 transition">
                        Restaurar Dades de Fàbrica (Reset Total)
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- SCRIPT DE L'APLICACIÓ -->
    <script>
        // Dades inicials per defecte (Parc de Bombers)
        const dadesInicials = {
            vehicles: [
                { id: "v1", codi: "51530", nom: "BUP (Bomba Urbana Pesada)", matricula: "4829-JHW" },
                { id: "v2", codi: "50030", nom: "BRP (Bomba Rural Pesada)", matricula: "9102-KLP" },
                { id: "v3", codi: "51544", nom: "FSV (Furgó de Salvaments)", matricula: "3310-HFR" },
                { id: "v4", codi: "0063", nom: "UPC (Unitat de Personal i Càrrega)", matricula: "1140-BCD" },
                { id: "v5", codi: "51590", nom: "AEA (Autoescala Automàtica)", matricula: "7720-XYZ" }
            ],
            material: [
                { id: "m1", codi: "BG-100234", nom: "Càmera tèrmica FLIR K55", serie: "FLIR-99821", categoria: "Sanitari / DEA", estat: "Operatiu", titular: "v1", compartimentTitular: "Cabina", ubicacioActual: "v1", compartimentActual: "Cabina", obs: "Imprescindible per recerca i incendis d'interior." },
                { id: "m2", codi: "BG-100235", nom: "Cisalla hidràulica Lukas eDRAULIC", serie: "LK-44120", categoria: "Rescat / Hidràulica", estat: "Operatiu", titular: "v3", compartimentTitular: "Armari 2", ubicacioActual: "v3", compartimentActual: "Armari 2", obs: "Bateria carregada al 100%." },
                { id: "m3", codi: "BG-100236", nom: "Separador hidràulic Lukas", serie: "LK-55102", categoria: "Rescat / Hidràulica", estat: "Operatiu", titular: "v3", compartimentTitular: "Armari 2", ubicacioActual: "v1", compartimentActual: "Armari 3", obs: "Prestat temporalment al BUP per servei especial." },
                { id: "m4", codi: "BG-100237", nom: "Motoserra Stihl MS 462", serie: "ST-88219", categoria: "Eines / Tall", estat: "Revisió pendent", titular: "v2", compartimentTitular: "Armari 1", ubicacioActual: "taller", compartimentActual: "taller", obs: "Canvi de cadena ifilat pendent." },
                { id: "m5", codi: "BG-100238", nom: "DEA Zoll AED Plus", serie: "ZOLL-11290", categoria: "Sanitari / DEA", estat: "Operatiu", titular: "v1", compartimentTitular: "Cabina", ubicacioActual: "v1", compartimentActual: "Cabina", obs: "Pegatins i parxes vigents fins 2027." },
                { id: "m6", codi: "BG-100239", nom: "Llança d'escuma mitjana", serie: "LE-33102", categoria: "Mànigues / Aigua", estat: "Operatiu", titular: "v1", compartimentTitular: "Armari 4", ubicacioActual: "v1", compartimentActual: "Armari 4", obs: "Revisat broc i junta." },
                { id: "m7", codi: "BG-100240", nom: "Generador portàtil Honda EU22i", serie: "HD-90182", categoria: "Il·luminació / Energia", estat: "Operatiu", titular: "v3", compartimentTitular: "Armari 5", ubicacioActual: "magatzem", compartimentActual: "magatzem", obs: "Reserva en magatzem central." }
            ],
            historial: [
                { data: "18/11/2026 10:30", materialNom: "Separador hidràulic Lukas", de: "51544 (FSV - Armari 2)", a: "51530 (BUP - Armari 3)", usuari: "Sergent Guàrdia" },
                { data: "17/11/2026 16:15", materialNom: "Motoserra Stihl MS 462", de: "50030 (BRP - Armari 1)", a: "Taller / Reparació", usuari: "Cap de Torn" }
            ]
        };

        // Carregar dades o inicialitzar LocalStorage
        let appData = JSON.parse(localStorage.getItem('firetrack_parc_data')) || dadesInicials;
        function guardarEstat() {
            localStorage.setItem('firetrack_parc_data', JSON.stringify(appData));
        }

        let pestanyaActual = 'flota';
        let vehicleSeleccionat = null; // Si està a la vista detall d'un vehicle
        let vistaModeVehicle = 'a-bord'; // 'a-bord' o 'titular'

        // Inicialització
        document.addEventListener('DOMContentLoaded', () => {
            if (appData.vehicles.length > 0 && !vehicleSeleccionat) {
                vehicleSeleccionat = appData.vehicles[0].id;
            }
            render();
        });

        function canviarPestanya(pestanya) {
            pestanyaActual = pestanya;
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('text-red-500');
                btn.classList.add('text-slate-400');
            });
            const btnActiu = document.getElementById(`nav-${pestanya}`);
            if(btnActiu) {
                btnActiu.classList.remove('text-slate-400');
                btnActiu.classList.add('text-red-500');
            }
            render();
        }

        function render() {
            const main = document.getElementById('main-content');
            main.innerHTML = '';

            if (pestanyaActual === 'flota') {
                main.innerHTML = renderVistaFlota();
            } else if (pestanyaActual === 'magatzem') {
                main.innerHTML = renderVistaMagatzem();
            } else if (pestanyaActual === 'rastreig') {
                main.innerHTML = renderVistaRastreig();
            } else if (pestanyaActual === 'historial') {
                main.innerHTML = renderVistaHistorial();
            }
        }

        // ================= VISTA FLOTA =================
        function renderVistaFlota() {
            const vehicleActiu = appData.vehicles.find(v => v.id === vehicleSeleccionat) || appData.vehicles[0];
            if (!vehicleActiu) return `<div class="text-center py-10 text-slate-400">No hi ha vehicles configurats.</div>`;

            // Calcular si té material fora o aliè
            const materialAboard = appData.material.filter(m => m.ubicacioActual === vehicleActiu.id);
            const materialTitular = appData.material.filter(m => m.titular === vehicleActiu.id);
            const foraDeDotacio = materialTitular.filter(m => m.ubicacioActual !== vehicleActiu.id);
            const materialsAliens = materialAboard.filter(m => m.titular !== vehicleActiu.id);

            // Generar pestanyes de vehicles horitzontals
            let htmlVehicles = '<div class="flex space-x-2 overflow-x-auto hide-scrollbar pb-3 mb-3 border-b border-slate-800">';
            appData.vehicles.forEach(v => {
                const esActiu = v.id === vehicleActiu.id;
                const teAnomalies = appData.material.some(m => m.titular === v.id && m.ubicacioActual !== v.id);
                htmlVehicles += `
                    <button onclick="seleccionarVehicle('${v.id}')" class="whitespace-nowrap px-4 py-2.5 rounded-xl text-xs font-semibold transition flex items-center space-x-2 border ${esActiu ? 'bg-red-600 text-white border-red-500 shadow-lg shadow-red-600/30' : 'bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700'}">
                        <i class="fa-solid fa-truck"></i>
                        <span>${v.codi}</span>
                        ${teAnomalies ? '<span class="w-2 h-2 rounded-full bg-amber-400"></span>' : ''}
                    </button>
                `;
            });
            htmlVehicles += '</div>';

            // Llistat de material segons mode (A bord vs Titular)
            let llistaMaterialHtml = '';
            const llistaActual = vistaModeVehicle === 'a-bord' ? materialAboard : materialTitular;

            if (llistaActual.length === 0) {
                llistaMaterialHtml = `
                    <div class="text-center py-12 bg-slate-950/40 rounded-2xl border border-slate-800/60 p-6">
                        <i class="fa-solid fa-box-open text-3xl text-slate-600 mb-2"></i>
                        <p class="text-sm text-slate-400">Cap material registrat en aquesta vista.</p>
                    </div>
                `;
            } else {
                // Agrupar per compartiment
                const compartiments = ['Cabina', 'Armari 1', 'Armari 2', 'Armari 3', 'Armari 4', 'Armari 5', 'Armari 6', 'Bomba', 'Sostre', 'Magatzem / Altres'];
                
                compartiments.forEach(comp => {
                    const itemsComp = llistaActual.filter(m => {
                        const ubicacioItem = vistaModeVehicle === 'a-bord' ? m.compartimentActual : m.compartimentTitular;
                        return (ubicacioItem === comp) || (!compartiments.includes(ubicacioItem) && comp === 'Magatzem / Altres');

                    if (itemsComp.length > 0) {
                        llistaMaterialHtml += `
                            <div class="mb-4">
                                <div class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 flex items-center space-x-1.5">
                                    <i class="fa-solid fa-folder-open text-red-500"></i>
                                    <span>${comp} (${itemsComp.length})</span>
                                </div>
                                <div class="space-y-2">
                        `;
                        itemsComp.forEach(m => {
                            const esFora = m.titular !== vehicleActiu.id;
                            const estaForaLoc = m.ubicacioActual !== m.titular;
                            
                            let badgeEstat = '';
                            if (m.estat === 'Operatiu') badgeEstat = '<span class="bg-emerald-500/10 text-emerald-400 text-[10px] px-2 py-0.5 rounded-md font-medium">Operatiu</span>';
                            else if (m.estat === 'Revisió pendent') badgeEstat = '<span class="bg-amber-500/10 text-amber-400 text-[10px] px-2 py-0.5 rounded-md font-medium">Revisió</span>';
                            else badgeEstat = '<span class="bg-red-500/10 text-red-400 text-[10px] px-2 py-0.5 rounded-md font-medium">Averiat</span>';

                            let vehicleTitularObj = appData.vehicles.find(v => v.id === m.titular);
                            let vehicleActualObj = appData.vehicles.find(v => v.id === m.ubicacioActual);
                            let textUbicacioReal = vehicleActualObj ? vehicleActualObj.codi : m.ubicacioActual.toUpperCase();

                            llistaMaterialHtml += `
                                <div class="bg-slate-950 border ${esFora ? 'border-amber-500/40' : 'border-slate-800'} rounded-2xl p-3.5 shadow-sm">
                                    <div class="flex items-start justify-between">
                                        <div class="flex-1 pr-2">
                                            <div class="flex items-center space-x-2 mb-1">
                                                <span class="text-xs font-mono font-bold text-red-400 bg-red-950/60 px-2 py-0.5 rounded border border-red-900/50">${m.codi}</span>
                                                ${badgeEstat}
                                                ${esFora ? `<span class="bg-amber-500/10 text-amber-300 text-[10px] px-2 py-0.5 rounded-md font-medium"><i class="fa-solid fa-right-left mr-1"></i>De ${vehicleTitularObj ? vehicleTitularObj.codi : 'Altre'}</span>` : ''}
                                            </div>
                                            <h4 class="font-bold text-sm text-white">${m.nom}</h4>
                                            <p class="text-xs text-slate-400 mt-0.5">Sèrie: ${m.serie || 'S/N'} · <span class="text-slate-300">Ubicació: <b>${textUbicacioReal} (${m.compartimentActual})</b></span></p>
                                            ${m.obs ? `<p class="text-xs text-slate-500 italic mt-1 bg-slate-900/80 px-2 py-1 rounded-lg">"${m.obs}"</p>` : ''}
                                        </div>
                                        <div class="flex flex-col space-y-1.5">
                                            <button onclick="obrirModalMoure('${m.id}')" class="bg-slate-800 hover:bg-slate-700 text-slate-200 p-2 rounded-xl text-xs transition flex items-center justify-center border border-slate-700" title="Moure material">
                                                <i class="fa-solid fa-right-left"></i>
                                            </button>
                                            <button onclick="editarMaterialModal('${m.id}')" class="bg-slate-800 hover:bg-slate-700 text-slate-200 p-2 rounded-xl text-xs transition flex items-center justify-center border border-slate-700" title="Editar material">
                                                <i class="fa-solid fa-pen"></i>
                                            </button>
                                        </div>
                                    </div>
                                    ${vistaModeVehicle === 'titular' && estaForaLoc ? `
                                        <div class="mt-2.5 pt-2 border-t border-slate-900 flex items-center justify-between text-xs">
                                            <span class="text-amber-400 font-medium"><i class="fa-solid fa-triangle-exclamation mr-1"></i> Actualment a: <b>${textUbicacioReal}</b></span>
                                            <button onclick="recuperarMaterial('${m.id}')" class="bg-red-600/20 hover:bg-red-600/30 text-red-400 px-2.5 py-1 rounded-lg font-semibold transition">Recuperar al vehicle</button>
                                        </div>
                                    ` : ''}
                                </div>
                            `;
                        });
                        llistaMaterialHtml += `</div></div>`;
                    }
                });
            }

            return `
                <div class="space-y-4">
                    ${htmlVehicles}
                    
                    <!-- Capçalera del vehicle seleccionat -->
                    <div class="bg-slate-950 border border-slate-800 rounded-2xl p-4 shadow-lg">
                        <div class="flex items-center justify-between mb-3">
                            <div>
                                <span class="text-xs font-mono font-bold text-red-500 bg-red-950 px-2 py-0.5 rounded border border-red-900">${vehicleActiu.codi}</span>
                                <h2 class="text-lg font-bold text-white mt-1">${vehicleActiu.nom}</h2>
                                <p class="text-xs text-slate-400">Matrícula: ${vehicleActiu.matricula}</p>
                            </div>
                            <div class="text-right">
                                <span class="text-2xl font-black text-white">${materialAboard.length}</span>
                                <p class="text-[10px] text-slate-400 uppercase">Ítems a bord</p>
                            </div>
                        </div>

                        <!-- Selector Mode Vistes -->
                        <div class="grid grid-cols-2 gap-2 bg-slate-900 p-1 rounded-xl border border-slate-800">
                            <button onclick="canviarModeVehicle('a-bord')" class="py-2 rounded-lg text-xs font-semibold transition ${vistaModeVehicle === 'a-bord' ? 'bg-red-600 text-white shadow' : 'text-slate-400 hover:text-white'}">
                                A Bord Actualment (${materialAboard.length})
                            </button>
                            <button onclick="canviarModeVehicle('titular')" class="py-2 rounded-lg text-xs font-semibold transition ${vistaModeVehicle === 'titular' ? 'bg-red-600 text-white shadow' : 'text-slate-400 hover:text-white'}">
                                Dotació Titular (${materialTitular.length})
                                ${foraDeDotacio.length > 0 ? `<span class="ml-1 bg-amber-400 text-slate-950 px-1.5 py-0.2 rounded-full text-[10px] font-bold">${foraDeDotacio.length}</span>` : ''}
                            </button>
                        </div>
                    </div>

                    <!-- Llistat de Materials -->
                    <div class="space-y-3">
                        ${llistaMaterialHtml}
                    </div>
                </div>
            `;
        }

        function seleccionarVehicle(id) {
            vehicleSeleccionat = id;
            render();
        }

        function canviarModeVehicle(mode) {
            vistaModeVehicle = mode;
            render();
        }

        // ================= VISTA MAGATZEM / TALLER =================

            const tallerItems = appData.material.filter(m => m.ubicacioActual === 'taller');

                        ${missatgeBuit}
                    </div>
                `;

            items.forEach(m => {

                html += `
                    <div class="bg-slate-950 border border-slate-800 rounded-2xl p-3.5 flex items-center justify-between">
                        <div>
                            <div class="flex items-center space-x-2 mb-1">
                                <span class="text-xs font-mono font-bold text-red-400 bg-red-950 px-2 py-0.5 rounded border border-red-900">${m.codi}</span>
                                <span class="text-[10px] bg-slate-900 text-slate-300 px-2 py-0.5 rounded">Titular: ${titularObj ? titularObj.codi : 'Parc'}</span>

                            <h4 class="font-bold text-sm text-white">${m.nom}</h4>

                        </div>

                            </button>
                            <button onclick="editarMaterialModal('${m.id}')" class="bg-slate-800 hover:bg-slate-700 text-slate-200 p-2 rounded-xl text-xs border border-slate-700" title="Editar">

                        </div>
                    </div>

        // ================= VISTA RASTREIG / CODIFICACIÓ =================
        function renderVistaRastreig() {
            return `
                <div class="space-y-4">
                    <div class="bg-slate-950 border border-slate-800 rounded-2xl p-4 shadow-lg">
                        <h2 class="text-base font-bold text-white mb-1 flex items-center space-x-2">
                            <i class="fa-solid fa-barcode text-red-500"></i>
                            <span>Rastreig Global per Codi BG</span>
                        </h2>
                        <p class="text-xs text-slate-400 mb-4">Introdueix o escaneja el codi de barres intern de Bombers de la Generalitat per localitzar l'eina instantàniament.</p>
                        
                        <div class="relative flex items-center">
                            <input type="text" id="input-cercador" oninput="buscarMaterialCodi(this.value)" placeholder="Ex: BG-100234..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 pl-10 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-red-500 font-mono">
                            <i class="fa-solid fa-magnifying-glass absolute left-3.5 text-slate-500"></i>
                            <button onclick="simular Escaner()" class="absolute right-2 bg-red-600 hover:bg-red-500 text-white px-3 py-1.5 rounded-lg text-xs font-semibold shadow transition flex items-center space-x-1">
                                <i class="fa-solid fa-camera"></i>
                                <span>Escanear</span>
                            </button>
                        </div>
                    </div>

                    <div id="resultats-cerca" class="space-y-3">
                        <!-- Per defecte mostrem tots o resultats de cerca -->
                        ${renderLlistaResultatsCerca(appData.material)}
                    </div>
                </div>
            `;
        }

        function buscarMaterialCodi(text) {
            const query = text.toLowerCase().trim();
            const filtrat = appData.material.filter(m => 
                m.codi.toLowerCase().includes(query) || 
                m.nom.toLowerCase().includes(query) || 
                (m.serie && m.serie.toLowerCase().includes(query)) ||
                m.categoria.toLowerCase().includes(query)
            );
            document.getElementById('resultats-cerca').innerHTML = renderLlistaResultatsCerca(filtrat);
        }

        function renderLlistaResultatsCerca(items) {
            if (items.length === 0) {
                return `<div class="text-center py-10 text-slate-500 text-xs">No s'ha trobat cap material amb aquest criteri.</div>`;
            }
            let html = '';
            items.forEach(m => {
                let vehicleUbicacio = appData.vehicles.find(v => v.id === m.ubicacioActual);
                let textUbicacio = vehicleUbicacio ? `${vehicleUbicacio.codi} (${m.compartimentActual})` : m.ubicacioActual.toUpperCase();

                html += `
                    <div class="bg-slate-950 border border-slate-800 rounded-2xl p-3.5 flex items-center justify-between">
                        <div>
                            <div class="flex items-center space-x-2 mb-1">
                                <span class="text-xs font-mono font-bold text-red-400 bg-red-950 px-2 py-0.5 rounded border border-red-900">${m.codi}</span>
                                <span class="text-[10px] bg-slate-900 text-slate-300 px-2 py-0.5 rounded">${m.estat}</span>
                            </div>
                            <h4 class="font-bold text-sm text-white">${m.nom}</h4>
                            <p class="text-xs text-slate-400 mt-0.5">Ubicació Actual: <b class="text-white">${textUbicacio}</b></p>
                        </div>
                        <div class="flex space-x-1.5">
                            <button onclick="obrirModalMoure('${m.id}')" class="bg-slate-800 hover:bg-slate-700 text-slate-200 p-2 rounded-xl text-xs border border-slate-700" title="Moure">
                                <i class="fa-solid fa-right-left"></i>
                            </button>
                            <button onclick="editarMaterialModal('${m.id}')" class="bg-slate-800 hover:bg-slate-700 text-slate-200 p-2 rounded-xl text-xs border border-slate-700" title="Editar">
                                <i class="fa-solid fa-pen"></i>
                            </button>
                        </div>
                    </div>
                `;
            });
            return html;
        }

        function simularEscaner() {
            const randomMat = appData.material[Math.floor(Math.random() * appData.material.length)];
            const input = document.getElementById('input-cercador');
            if(input) {
                input.value = randomMat.codi;
                buscarMaterialCodi(randomMat.codi);
            }
        }

        // ================= VISTA HISTORIAL =================
        function renderVistaHistorial() {
            let html = `
                <div class="space-y-4">
                    <div class="flex items-center justify-between">
                        <h2 class="text-base font-bold text-white flex items-center space-x-2">
                            <i class="fa-solid fa-clock-rotate-left text-red-500"></i>
                            <span>Registre de Moviments</span>
                        </h2>
                        ${appData.historial.length > 0 ? `<button onclick="netejarHistorial()" class="text-xs text-slate-400 hover:text-red-400 transition">Netejar registre</button>` : ''}
                    </div>
            `;

            if (appData.historial.length === 0) {
                html += `
                    <div class="text-center py-12 bg-slate-950/40 rounded-2xl border border-slate-800/60 p-6 text-xs text-slate-500">
                        Cap moviment registrat recentment.
                    </div>
                `;
            } else {
                html += '<div class="space-y-2.5">';
                appData.historial.forEach(h => {
                    html += `
                        <div class="bg-slate-950 border border-slate-800 rounded-2xl p-3.5 text-xs space-y-1">
                            <div class="flex items-center justify-between text-slate-400 text-[10px]">
                                <span><i class="fa-regular fa-clock mr-1"></i>${h.data}</span>
                                <span class="bg-slate-900 px-2 py-0.5 rounded text-slate-300 font-medium">${h.usuari}</span>
                            </div>
                            <p class="font-bold text-white text-sm">${h.materialNom}</p>
                            <p class="text-slate-400 flex items-center space-x-1.5 pt-0.5">
                                <span class="text-red-400">${h.de}</span>
                                <i class="fa-solid fa-arrow-right text-[10px] text-slate-600"></i>
                                <span class="text-emerald-400">${h.a}</span>
                            </p>
                        </div>
                    `;
                });
                html += '</div>';
            }
            html += '</div>';
            return html;
        }

        function netejarHistorial() {
            if (confirm("Segur que vols esborrar tot l'historial de moviments?")) {
                appData.historial = [];
                guardarEstat();
                render();
            }
        }

        // ================= GESTIÓ MODAL MOURE MATERIAL =================
        function obrirModalMoure(materialId) {
            const material = appData.material.find(m => m.id === materialId);
            if (!material) return;

            document.getElementById('moure-material-id').value = material.id;
            document.getElementById('moure-material-nom').textContent = `${material.nom} (${material.codi})`;
            
            // Omplir select vehicles
            const selectVehicles = document.getElementById('moure-vehicle-id');
            selectVehicles.innerHTML = '';
            appData.vehicles.forEach(v => {
                selectVehicles.innerHTML += `<option value="${v.id}">${v.codi} - ${v.nom}</option>`;
            });

            // Seleccionar per defecte el vehicle actual si escau
            if (material.ubicacioActual.startsWith('v')) {
                document.getElementById('moure-desti-tipus').value = 'vehicle';
                selectVehicles.value = material.ubicacioActual;
                document.getElementById('moure-compartiment').value = material.compartimentActual || 'Cabina';
            } else {
                document.getElementById('moure-desti-tipus').value = material.ubicacioActual;
            }
            actualitzarDestiTipus();

            document.getElementById('modal-moure').classList.remove('hidden');
        }

        function tancarModalMoure() {
            document.getElementById('modal-moure').classList.add('hidden');
        }

        function actualitzarDestiTipus() {
            const tipus = document.getElementById('moure-desti-tipus').value;
            const blocVehicle = document.getElementById('bloc-seleccio-vehicle');
            if (tipus === 'vehicle') {
                blocVehicle.classList.remove('hidden');
            } else {
                blocVehicle.classList.add('hidden');
            }
        }

        function guardarMoviment(e) {
            e.preventDefault();
            const matId = document.getElementById('moure-material-id').value;
            const tipusDesti = document.getElementById('moure-desti-tipus').value;
            const material = appData.material.find(m => m.id === matId);
            if (!material) return;

            let deUbicacioText = obtenirTextUbicacio(material.ubicacioActual, material.compartimentActual);
            let aUbicacioId = tipusDesti;
            let aCompartimentText = '-';
            let aUbicacioText = '';

            if (tipusDesti === 'vehicle') {
                aUbicacioId = document.getElementById('moure-vehicle-id').value;
                aCompartimentText = document.getElementById('moure-compartiment').value;
                let vObj = appData.vehicles.find(v => v.id === aUbicacioId);
                aUbicacioText = `${vObj ? vObj.codi : 'Vehicle'} (${aCompartimentText})`;
            } else if (tipusDesti === 'magatzem') {
                aUbicacioText = 'Magatzem Central';
            } else if (tipusDesti === 'taller') {
                aUbicacioText = 'Taller / Reparació';
            } else if (tipusDesti === 'baixa') {
                aUbicacioText = 'Baixa / Fora de servei';
            }

            material.ubicacioActual = aUbicacioId;
            material.compartimentActual = aCompartimentText;

            // Afegir a historial
            appData.historial.unshift({
                data: new Date().toLocaleString('ca-ES', { dateStyle: 'short', timeStyle: 'short' }),
                materialNom: material.nom,
                de: deUbicacioText,
                a: aUbicacioText,
                usuari: 'Bomber de guàrdia'
            });

            guardarEstat();
            tancarModalMoure();
            render();
        }

        function recuperarMaterial(materialId) {
            const material = appData.material.find(m => m.id === materialId);
            if (!material) return;

            let deUbicacioText = obtenirTextUbicacio(material.ubicacioActual, material.compartimentActual);
            material.ubicacioActual = material.titular;
            material.compartimentActual = material.compartimentTitular;

            let vTitular = appData.vehicles.find(v => v.id === material.titular);
            let aUbicacioText = `${vTitular ? vTitular.codi : 'Vehicle'} (${material.compartimentTitular})`;

            appData.historial.unshift({
                data: new Date().toLocaleString('ca-ES', { dateStyle: 'short', timeStyle: 'short' }),
                materialNom: material.nom,
                de: deUbicacioText,
                a: aUbicacioText,
                usuari: 'Recuperació Automàtica'
            });

            guardarEstat();
            render();
        }

        function obtenirTextUbicacio(ubicacioId, compartiment) {
            if (ubicacioId.startsWith('v')) {
                let v = appData.vehicles.find(veh => veh.id === ubicacioId);
                return `${v ? v.codi : 'Vehicle'} (${compartiment || 'General'})`;
            }
            if (ubicacioId === 'magatzem') return 'Magatzem Central';
            if (ubicacioId === 'taller') return 'Taller / Reparació';
            if (ubicacioId === 'baixa') return 'Baixa';
            return ubicacioId;
        }

        // ================= GESTIÓ CREACIÓ / EDICIÓ MATERIAL =================
        function nouMaterialModal() {
            document.getElementById('edit-mat-id').value = '';
            document.getElementById('modal-mat-titol').textContent = 'Nou Material';
            document.getElementById('edit-mat-nom').value = '';
            document.getElementById('edit-mat-codi').value = `BG-${Math.floor(100000 + Math.random() * 900000)}` ;
            document.getElementById('edit-mat-serie').value = '';
            document.getElementById('edit-mat-obs').value = '';
            
            omplirSelectsModalMaterial();
            document.getElementById('edit-mat-titular').value = vehicleSeleccionat || appData.vehicles[0].id;

            document.getElementById('modal-material').classList.remove('hidden');
        }

        function editarMaterialModal(materialId) {
            const m = appData.material.find(item => item.id === materialId);
            if (!m) return;

            document.getElementById('edit-mat-id').value = m.id;
            document.getElementById('modal-mat-titol').textContent = 'Editar Material';
            document.getElementById('edit-mat-nom').value = m.nom;
            document.getElementById('edit-mat-codi').value = m.codi;
            document.getElementById('edit-mat-serie').value = m.serie || '';
            document.getElementById('edit-mat-categoria').value = m.categoria;
            document.getElementById('edit-mat-estat').value = m.estat;
            
            omplirSelectsModalMaterial();
            document.getElementById('edit-mat-titular').value = m.titular;
            document.getElementById('edit-mat-comp-titular').value = m.compartimentTitular || 'Cabina';
            document.getElementById('edit-mat-obs').value = m.obs || '';

            document.getElementById('modal-material').classList.remove('hidden');
        }

        function omplirSelectsModalMaterial() {
            const selectTitular = document.getElementById('edit-mat-titular');
            selectTitular.innerHTML = '';
            appData.vehicles.forEach(v => {
                selectTitular.innerHTML += `<option value="${v.id}">${v.codi} - ${v.nom}</option>`;
            });
        }

        function tancarModalMaterial() {
            document.getElementById('modal-material').classList.add('hidden');
        }

        function guardarMaterial(e) {
            e.preventDefault();
            const id = document.getElementById('edit-mat-id').value;
            const nom = document.getElementById('edit-mat-nom').value;
            const codi = document.getElementById('edit-mat-codi').value;
            const serie = document.getElementById('edit-mat-serie').value;
            const categoria = document.getElementById('edit-mat-categoria').value;
            const estat = document.getElementById('edit-mat-estat').value;
            const titular = document.getElementById('edit-mat-titular').value;
            const compTitular = document.getElementById('edit-mat-comp-titular').value;
            const obs = document.getElementById('edit-mat-obs').value;

            if (id) {
                // Editar existent
                const m = appData.material.find(item => item.id === id);
                if (m) {
                    m.nom = nom;
                    m.codi = codi;
                    m.serie = serie;
                    m.categoria = categoria;
                    m.estat = estat;
                    m.titular = titular;
                    m.compartimentTitular = compTitular;
                    m.obs = obs;
                }
            } else {
                // Nou ítem
                const nouId = 'm_' + Date.now();
                appData.material.push({
                    id: nouId,
                    codi: codi,
                    nom: nom,
                    serie: serie,
                    categoria: categoria,
                    estat: estat,
                    titular: titular,
                    compartimentTitular: compTitular,
                    ubicacioActual: titular,
                    compartimentActual: compTitular,
                    obs: obs
                });
            }

            guardarEstat();
            tancarModalMaterial();
            render();
        }

        // ================= GESTIÓ VEHICLES & BACKUP =================
        function obrirModalGestio() {
            renderLlistaVehiclesGestio();
            document.getElementById('modal-gestio').classList.remove('hidden');
        }

        function tancarModalGestio() {
            document.getElementById('modal-gestio').classList.add('hidden');
        }

        function renderLlistaVehiclesGestio() {
            const container = document.getElementById('llista-vehicles-gestio');
            container.innerHTML = '';
            appData.vehicles.forEach(v => {
                container.innerHTML += `
                    <div class="bg-slate-950 border border-slate-800 rounded-xl p-2.5 flex items-center justify-between text-xs">
                        <div>
                            <span class="font-bold text-white">${v.codi}</span> - <span class="text-slate-400">${v.nom}</span>
                        </div>
                        <button onclick="eliminarVehicle('${v.id}')" class="text-slate-500 hover:text-red-400 p-1">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                `;
            });
        }

        function afegirVehiclePrompt() {
            const codi = prompt("Introdueix el codi del vehicle (Ex: 51550):");
            if (!codi) return;
            const nom = prompt("Introdueix el nom o tipus (Ex: Furgó SPI):", "Vehicle Parc");
            const matricula = prompt("Introdueix la matrícula:", "0000-XXX");

            const nouId = 'v_' + Date.now();
            appData.vehicles.push({ id: nouId, codi, nom, matricula });
            guardarEstat();
            renderLlistaVehiclesGestio();
            render();
        }

        function eliminarVehicle(id) {
            if (appData.vehicles.length <= 1) {
                alert("No pots eliminar l'únic vehicle del parc.");
                return;
            }
            if (confirm("Segur que vols eliminar aquest vehicle?")) {
                appData.vehicles = appData.vehicles.filter(v => v.id !== id);
                guardarEstat();
                renderLlistaVehiclesGestio();
                render();
            }
        }

        function exportarJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "firetrack_parc_backup.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importarJSON(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if (parsed.vehicles && parsed.material) {
                        appData = parsed;
                        guardarEstat();
                        tancarModalGestio();
                        render();
                        alert("Dades importades correctament!");
                    } else {
                        alert("El fitxer no té un format vàlid.");
                    }
                } catch(err) {
                    alert("Error al llegir el fitxer JSON.");
                }
            };
            reader.readAsText(file);
        }

        function reiniciarDadesFabrica() {
            if (confirm("Atenció: Esborraràs totes les modificacions i restauraràs l'estat inicial. Estàs segur?")) {
                appData = JSON.parse(JSON.stringify(dadesInicials));
                guardarEstat();
                tancarModalGestio();
                vehicleSeleccionat = appData.vehicles[0].id;
                render();
            }
        }
    </script>
</body>
</html>
