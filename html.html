<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FireTrack Parc - Inventari Mòbil</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            -webkit-tap-highlight-color: transparent;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        @media print {
            body {
                background-color: white !important;
                color: black !important;
            }
            .no-print {
                display: none !important;
            }
            #print-area {
                display: block !important;
                position: static !important;
                width: 100% !important;
                color: black !important;
            }
            table {
                width: 100%;
                border-collapse: collapse;
                font-size: 12px;
            }
            th, td {
                border: 1px solid #cbd5e1;
                padding: 6px 8px;
                text-align: left;
            }
            th {
                background-color: #f1f5f9 !important;
                -webkit-print-color-adjust: exact;
            }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased min-h-screen flex flex-col justify-between selection:bg-red-600 selection:text-white">

    <!-- CAPÇALERA -->
    <header class="no-print bg-slate-950 border-b border-slate-800 sticky top-0 z-40 px-4 py-3 flex items-center justify-between shadow-md">
        <div class="flex items-center space-x-3">
            <div class="bg-red-600 text-white p-2 rounded-xl shadow-lg shadow-red-600/30 flex items-center justify-center">
                <i class="fa-solid fa-truck-fire text-lg"></i>
            </div>
            <div>
                <h1 class="font-bold text-base tracking-wide text-white leading-tight">FireTrack <span class="text-red-500">Parc</span></h1>
                <p class="text-xs text-slate-400">Parc de Bombers · Inventari Mòbil</p>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <button onclick="obrirModalGestio()" class="bg-slate-800 hover:bg-slate-700 active:bg-slate-600 text-slate-300 p-2.5 rounded-xl text-xs font-medium transition flex items-center space-x-1.5 border border-slate-700">
                <i class="fa-solid fa-gear text-slate-400"></i>
                <span class="hidden sm:inline">Gestió</span>
            </button>
            <button onclick="nouMaterialModal()" class="bg-red-600 hover:bg-red-500 active:bg-red-700 text-white px-3 py-2.5 rounded-xl text-xs font-semibold shadow-lg shadow-red-600/20 transition flex items-center space-x-1.5">
                <i class="fa-solid fa-plus"></i>
                <span>Nou</span>
            </button>
        </div>
    </header>

    <!-- CONTINGUT PRINCIPAL -->
    <main id="main-content" class="no-print flex-1 max-w-lg w-full mx-auto px-4 py-4 pb-24">
    </main>

    <!-- ZONA D'IMPRESSIÓ -->
    <div id="print-area" class="hidden p-6"></div>

    <!-- BARRA DE NAVEGACIÓ INFERIOR -->
    <nav class="no-print bg-slate-950 border-t border-slate-800 fixed bottom-0 left-0 right-0 z-40 max-w-lg mx-auto grid grid-cols-4 py-2 px-3 shadow-2xl">
        <button onclick="canviarPestanya('flota')" id="nav-flota" class="nav-btn flex flex-col items-center justify-center py-1.5 text-red-500 transition">
            <i class="fa-solid fa-truck text-lg mb-0.5"></i>
            <span class="text-[10px] font-medium tracking-wide">Flota</span>
        </button>
        <button onclick="canviarPestanya('magatzem')" id="nav-magatzem" class="nav-btn flex flex-col items-center justify-center py-1.5 text-slate-400 hover:text-slate-200 transition">
            <i class="fa-solid fa-warehouse text-lg mb-0.5"></i>
            <span class="text-[10px] font-medium tracking-wide">Magatzem</span>
        </button>
        <button onclick="canviarPestanya('desplaçaments')" id="nav-desplaçaments" class="nav-btn flex flex-col items-center justify-center py-1.5 text-slate-400 hover:text-slate-200 transition">
            <i class="fa-solid fa-route text-lg mb-0.5"></i>
            <span class="text-[10px] font-medium tracking-wide">Desplaçaments</span>
        </button>
        <button onclick="canviarPestanya('historial')" id="nav-historial" class="nav-btn flex flex-col items-center justify-center py-1.5 text-slate-400 hover:text-slate-200 transition">
            <i class="fa-solid fa-clock-rotate-left text-lg mb-0.5"></i>
            <span class="text-[10px] font-medium tracking-wide">Historial</span>
        </button>
    </nav>

    <!-- MODAL DE MOVIMENT DE MATERIAL -->
    <div id="modal-moure" class="no-print fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-t-3xl sm:rounded-2xl p-5 shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between pb-3 border-b border-slate-800 mb-4">
                <div class="flex items-center space-x-2">
                    <div class="bg-red-500/10 text-red-500 p-2 rounded-lg">
                        <i class="fa-solid fa-right-left"></i>
                    </div>
                    <h3 class="font-bold text-white text-sm">Moure Material</h3>
                </div>
                <button onclick="tancarModal('modal-moure')" class="text-slate-400 hover:text-white p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <form id="form-moure" onsubmit="guardarMoviment(event)" class="space-y-4">
                <input type="hidden" id="moure-material-id">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Material Seleccionat</label>
                    <p id="moure-material-nom" class="text-sm font-bold text-white bg-slate-950 px-3 py-2 rounded-xl border border-slate-800"></p>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Nova Ubicació Destí</label>
                    <select id="moure-desti-tipus" onchange="actualitzarDestiTipus()" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-red-500">
                        <option value="vehicle">Vehicle (Camió)</option>
                        <option value="magatzem">Magatzem Central</option>
                        <option value="taller">Taller / Reparació</option>
                        <option value="baixa">Baixa / Fora de servei</option>
                    </select>
                </div>
                <div id="bloc-seleccio-vehicle" class="space-y-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Seleccionar Camió</label>
                        <select id="moure-vehicle-id" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-red-500"></select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Compartiment / Zona Destí</label>
                        <select id="moure-compartiment" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-red-500">
                            <option value="Cabina">Cabina</option>
                            <option value="Armari 1">Armari 1</option>
                            <option value="Armari 3">Armari 3</option>
                            <option value="Armari 5">Armari 5</option>
                            <option value="Armari 2">Armari 2</option>
                            <option value="Armari 4">Armari 4</option>
                            <option value="Armari 6">Armari 6</option>
                            <option value="Bomba">Bomba</option>
                            <option value="Sostre">Sostre</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Observacions del moviment (opcional)</label>
                    <input type="text" id="moure-notes" placeholder="Ex: Canvi temporal per revisió" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-red-500">
                </div>
                <button type="submit" class="w-full bg-red-600 hover:bg-red-500 text-white font-semibold py-3 rounded-xl text-sm shadow-lg shadow-red-600/20 transition">
                    Confirmar Moviment
                </button>
            </form>
        </div>
    </div>

    <!-- MODAL NOU / EDITAR MATERIAL -->
    <div id="modal-material" class="no-print fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-t-3xl sm:rounded-2xl p-5 shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between pb-3 border-b border-slate-800 mb-4">
                <div class="flex items-center space-x-2">
                    <div class="bg-red-500/10 text-red-500 p-2 rounded-lg">
                        <i class="fa-solid fa-box-open"></i>
                    </div>
                    <h3 id="modal-material-titol" class="font-bold text-white text-sm">Nou Material</h3>
                </div>
                <button onclick="tancarModal('modal-material')" class="text-slate-400 hover:text-white p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <form id="form-material" onsubmit="guardarMaterial(event)" class="space-y-3.5">
                <input type="hidden" id="mat-id">
                <input type="hidden" id="mat-foto-base64">

                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Nom del Material *</label>
                    <input type="text" id="mat-nom" required placeholder="Ex: Cisalla hidràulica Lukas" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-red-500">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Codi de barres (Opcional)</label>
                        <input type="text" id="mat-codi" placeholder="Ex: BMB-0421" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-red-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Categoria *</label>
                        <select id="mat-categoria" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-red-500">
                            <option value="Rescat urbà">Rescat urbà</option>
                            <option value="Hidràulica">Hidràulica</option>
                            <option value="Risc elèctric">Risc elèctric</option>
                            <option value="Riscos tecnològics">Riscos tecnològics</option>
                            <option value="Incendi urbà">Incendi urbà</option>
                            <option value="Incendi forestal">Incendi forestal</option>
                            <option value="Sanitari">Sanitari</option>
                            <option value="Altura / Vertical">Altura / Vertical</option>
                            <option value="Altres">Altres</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Fotografia del Material (Opcional)</label>
                    <div class="flex items-center space-x-2">
                        <label class="flex-1 cursor-pointer bg-slate-950 border border-dashed border-slate-700 hover:border-red-500 rounded-xl px-3 py-2.5 text-xs text-slate-300 flex items-center justify-center space-x-2 transition">
                            <i class="fa-solid fa-camera text-red-500"></i>
                            <span>Fer foto o seleccionar</span>
                            <input type="file" id="mat-foto-input" accept="image/*" capture="environment" onchange="processarFoto(event)" class="hidden">
                        </label>
                        <button type="button" id="btn-eliminar-foto" onclick="eliminarFoto()" class="hidden bg-slate-800 hover:bg-red-900/50 text-slate-300 p-2.5 rounded-xl text-xs border border-slate-700" title="Eliminar foto">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                    <div id="preview-foto-container" class="hidden mt-2 relative w-full h-32 bg-slate-950 rounded-xl border border-slate-800 overflow-hidden flex items-center justify-center">
                        <img id="preview-foto" src="" alt="Vista prèvia" class="max-h-full max-w-full object-contain">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Ubicació inicial</label>
                        <select id="mat-ubicacio-tipus" onchange="toggleUbicacioMaterial()" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-red-500">
                            <option value="vehicle">Vehicle (Camió)</option>
                            <option value="magatzem">Magatzem Central</option>
                            <option value="taller">Taller</option>
                        </select>
                    </div>
                    <div id="mat-bloc-vehicle">
                        <label class="block text-xs font-medium text-slate-400 mb-1">Vehicle</label>
                        <select id="mat-vehicle-id" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-red-500"></select>
                    </div>
                </div>

                <div id="mat-bloc-compartiment">
                    <label class="block text-xs font-medium text-slate-400 mb-1">Compartiment</label>
                    <select id="mat-compartiment" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-red-500">
                        <option value="Cabina">Cabina</option>
                        <option value="Armari 1">Armari 1</option>
                        <option value="Armari 3">Armari 3</option>
                        <option value="Armari 5">Armari 5</option>
                        <option value="Armari 2">Armari 2</option>
                        <option value="Armari 4">Armari 4</option>
                        <option value="Armari 6">Armari 6</option>
                        <option value="Bomba">Bomba</option>
                        <option value="Sostre">Sostre</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Notes / Estat (opcional)</label>
                    <input type="text" id="mat-notes" placeholder="Ex: Revisat el mes passat, bateria plena" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-red-500">
                </div>

                <button type="submit" class="w-full bg-red-600 hover:bg-red-500 text-white font-semibold py-3 rounded-xl text-sm shadow-lg shadow-red-600/20 transition mt-2">
                    Desar Material
                </button>
            </form>
        </div>
    </div>

    <!-- MODAL GESTIÓ VEHICLES -->
    <div id="modal-gestio" class="no-print fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-t-3xl sm:rounded-2xl p-5 shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between pb-3 border-b border-slate-800 mb-4">
                <h3 class="font-bold text-white text-sm">Gestió de Vehicles i Dades</h3>
                <button onclick="tancarModal('modal-gestio')" class="text-slate-400 hover:text-white p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <div class="space-y-4">
                <div>
                    <h4 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Afegir Vehicle (Indicatiu)</h4>
                    <form onsubmit="afegirVehicle(event)" class="flex space-x-2">
                        <input type="text" id="nou-vehicle-codi" required placeholder="Ex: 51530" class="w-24 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-red-500">
                        <input type="text" id="nou-vehicle-nom" required placeholder="Ex: BRP - Bomba Rural Pesant" class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-red-500">
                        <button type="submit" class="bg-red-600 hover:bg-red-500 text-white px-3.5 py-2 rounded-xl text-xs font-semibold">Afegir</button>
                    </form>
                </div>
                <div>
                    <h4 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Vehicles Actius</h4>
                    <div id="llista-vehicles-gestio" class="space-y-2"></div>
                </div>
                <div class="pt-3 border-t border-slate-800 flex justify-between">
                    <button onclick="exportarDades()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-2 rounded-xl text-xs font-medium">
                        <i class="fa-solid fa-download mr-1"></i> Còpia JSON
                    </button>
                    <button onclick="reiniciarDades()" class="bg-red-950/50 hover:bg-red-900/60 text-red-400 border border-red-900/50 px-3 py-2 rounded-xl text-xs font-medium">
                        Restablir exemples
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL VISUALITZACIÓ FOTO GRAN -->
    <div id="modal-foto" onclick="tancarModal('modal-foto')" class="no-print fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl p-3 text-center" onclick="event.stopPropagation()">
            <img id="foto-gran-img" src="" class="max-h-[70vh] mx-auto rounded-xl object-contain">
            <p id="foto-gran-titol" class="text-sm font-semibold text-white mt-3"></p>
            <button onclick="tancarModal('modal-foto')" class="mt-3 w-full bg-slate-800 text-slate-300 py-2 rounded-xl text-xs font-medium">Tancar</button>
        </div>
    </div>

    <script>
        const ORDRE_COMPARTIMENTS = [
            'Cabina',
            'Armari 1',
            'Armari 3',
            'Armari 5',
            'Armari 2',
            'Armari 4',
            'Armari 6',
            'Bomba',
            'Sostre'
        ];

        function compararCompartiments(a, b) {
            const idxA = ORDRE_COMPARTIMENTS.indexOf(a);
            const idxB = ORDRE_COMPARTIMENTS.indexOf(b);
            if (idxA === -1 && idxB === -1) return a.localeCompare(b);
            if (idxA === -1) return 1;
            if (idxB === -1) return -1;
            return idxA - idxB;
        }

        const DADES_EXEMPLE = {
            vehicles: [
                { id: 'v1', codi: '51530', nom: 'BUP - Bomba Urbana Pesant' },
                { id: 'v2', codi: '51532', nom: 'BRP - Bomba Rural Pesant' },
                { id: 'v3', codi: '51541', nom: 'FSV - Furgó Salvaments Varis' }
            ],
            materials: [
                {
                    id: 'm1',
                    nom: 'Separador hidràulic Holmatro',
                    codi: 'BMB-1042',
                    categoria: 'Rescat urbà',
                    ubicacioTipus: 'vehicle',
                    vehicleId: 'v1',
                    compartiment: 'Armari 1',
                    notes: 'Revisat i greixat',
                    foto: ''
                },
                {
                    id: 'm2',
                    nom: 'Màniga 70mm (20m) Racor Barcelona',
                    codi: '',
                    categoria: 'Hidràulica',
                    ubicacioTipus: 'vehicle',
                    vehicleId: 'v1',
                    compartiment: 'Armari 3',
                    notes: 'Sense codi de barres assignat',
                    foto: ''
                },
                {
                    id: 'm3',
                    nom: 'Detector de tensió sense contacte',
                    codi: 'BMB-3091',
                    categoria: 'Risc elèctric',
                    ubicacioTipus: 'vehicle',
                    vehicleId: 'v1',
                    compartiment: 'Cabina',
                    notes: 'Piles noves',
                    foto: ''
                },
                {
                    id: 'm4',
                    nom: 'Explosímetre multigas Dräger',
                    codi: 'BMB-4410',
                    categoria: 'Riscos tecnològics',
                    ubicacioTipus: 'magatzem',
                    vehicleId: null,
                    compartiment: '',
                    notes: 'Calibratge vigent',
                    foto: ''
                }
            ],
            historial: [
                {
                    id: 'h1',
                    data: new Date().toLocaleString('ca-ES', { dateStyle: 'short', timeStyle: 'short' }),
                    materialNom: 'Separador hidràulic Holmatro',
                    origen: 'Magatzem Central',
                    desti: '51530 (Armari 1)',
                    notes: 'Assignació de guàrdia'
                }
            ]
        };

        let estat = JSON.parse(localStorage.getItem('firetrack_estat_v2')) || DADES_EXEMPLE;
        let pestanyaActiva = 'flota';
        let vehicleSeleccionatId = estat.vehicles[0]?.id || null;
        let filtreCategoria = 'Totes';
        let cercaText = '';

        function desarEstat() {
            try {
                localStorage.setItem('firetrack_estat_v2', JSON.stringify(estat));
            } catch (e) {
                alert('Memòria plena: prova amb una fotografia més lleugera o elimina algun element antic.');
            }
        }

        function canviarPestanya(pestanya) {
            pestanyaActiva = pestanya;
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('text-red-500');
                btn.classList.add('text-slate-400');
            });
            document.getElementById(`nav-${pestanya}`).classList.remove('text-slate-400');
            document.getElementById(`nav-${pestanya}`).classList.add('text-red-500');
            renderitzar();
        }

        function renderitzar() {
            const main = document.getElementById('main-content');
            if (pestanyaActiva === 'flota') renderitzarFlota(main);
            else if (pestanyaActiva === 'magatzem') renderitzarMagatzem(main);
            else if (pestanyaActiva === 'desplaçaments') renderitzarDesplacaments(main);
            else if (pestanyaActiva === 'historial') renderitzarHistorial(main);
        }

        function renderitzarFlota(container) {
            if (!vehicleSeleccionatId && estat.vehicles.length > 0) {
                vehicleSeleccionatId = estat.vehicles[0].id;
            }
            const vehicleActual = estat.vehicles.find(v => v.id === vehicleSeleccionatId);
            const materialsVehicle = estat.materials
                .filter(m => m.ubicacioTipus === 'vehicle' && m.vehicleId === vehicleSeleccionatId)
                .sort((a, b) => compararCompartiments(a.compartiment, b.compartiment));

            const categories = ['Totes', 'Rescat urbà', 'Hidràulica', 'Risc elèctric', 'Riscos tecnològics', 'Incendi urbà', 'Incendi forestal', 'Sanitari', 'Altura / Vertical', 'Altres'];
            const materialsFiltrats = materialsVehicle.filter(m => {
                const coincideixCat = filtreCategoria === 'Totes' || m.categoria === filtreCategoria;
                const coincideixText = m.nom.toLowerCase().includes(cercaText.toLowerCase()) || (m.codi && m.codi.toLowerCase().includes(cercaText.toLowerCase())) || (m.compartiment && m.compartiment.toLowerCase().includes(cercaText.toLowerCase()));
                return coincideixCat && coincideixText;
            });

            container.innerHTML = `
                <div class="flex space-x-2 overflow-x-auto hide-scrollbar pb-2 mb-3">

        function processarFoto(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 450;
                    const scale = MAX_WIDTH / img.width;
                    canvas.width = img.width > MAX_WIDTH ? MAX_WIDTH : img.width;
                    canvas.height = img.width > MAX_WIDTH ? img.height * scale : img.height;

                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.75);

                    document.getElementById('mat-foto-base64').value = dataUrl;
                    document.getElementById('preview-foto').src = dataUrl;
                    document.getElementById('preview-foto-container').classList.remove('hidden');
                    document.getElementById('btn-eliminar-foto').classList.remove('hidden');
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function guardarMaterial(event) {
            event.preventDefault();
            const id = document.getElementById('mat-id').value;
            const tipus = document.getElementById('mat-ubicacio-tipus').value;

            const dades = {
                id: id || 'm' + Date.now(),
                nom: document.getElementById('mat-nom').value.trim(),
                codi: document.getElementById('mat-codi').value.trim(),
                categoria: document.getElementById('mat-categoria').value,
                ubicacioTipus: tipus,
                vehicleId: tipus === 'vehicle' ? document.getElementById('mat-vehicle-id').value : null,
                compartiment: tipus === 'vehicle' ? document.getElementById('mat-compartiment').value : '',
                notes: document.getElementById('mat-notes').value.trim(),
                foto: document.getElementById('mat-foto-base64').value
            };

            if (id) {
                const index = estat.materials.findIndex(x => x.id === id);
                estat.materials[index] = dades;
            } else {
                estat.materials.unshift(dades);
                estat.historial.unshift({
                    id: 'h' + Date.now(),
                    data: new Date().toLocaleString('ca-ES', { dateStyle: 'short', timeStyle: 'short' }),

            desarEstat();
            tancarModal('modal-material');
            renderitzar();

            const origenText = obtenirTextUbicacio(m);

                    m.compartiment = '';
